<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickGrabAI</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <header><h1>QuickGrabAI</h1><p class="muted">Capture a region. Get an answer.</p></header>
  <nav class="tabs" aria-label="Extension sections"><button class="tab active" data-tab="capture">Capture</button><button class="tab" data-tab="gallery">Gallery</button><button class="tab" data-tab="settings">Settings</button></nav>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="capture" class="tab-content">
    <p id="captureSummary" class="muted"></p>
    <button id="captureBtn" class="full">Capture screenshot</button>
    <p class="muted">Drag over the area to analyze. Press Esc to cancel.</p>
    <p class="muted">Only your selected region is sent to OpenAI. API charges apply.</p>
  </section>
  <section id="gallery" class="tab-content" hidden><div id="galleryItems" class="gallery compact"></div><button id="openGallery" class="secondary full">Open full gallery</button></section>
  <section id="settings" class="tab-content" hidden><div id="settingsForm"></div><button id="openSettings" class="secondary full">Open settings in a tab</button></section>
  <footer><a href="privacy-policy.html" target="_blank" rel="noopener">Privacy</a><span>Version 1.2.0</span></footer>
  <script type="module" src="popup.js"></script>
</body></html>
